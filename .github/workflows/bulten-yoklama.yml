name: Bülten yoklaması

# Elle çalıştırılır: Actions sekmesi → "Bülten yoklaması" → Run workflow.
# Bülteni indirir, ayrıştırır ve yapı raporunu iş özetine yazar.
# Bülten PDF'i yüklenmez; kişi adları hiçbir çıktıya yazılmaz.

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Resmî Marka Bülteni PDF adresi (turkpatent.gov.tr/bultenler sayfasındaki İndir bağlantısı)"
        required: true
        default: "https://webim.turkpatent.gov.tr/file/fb63aca2-4afc-4d1a-ab41-f72c2c07ced3?name=503&download"
      max_pages:
        description: "En fazla kaç sayfa okunsun (0 = tamamı)"
        required: false
        default: "0"
      samples:
        description: "Gözle kontrol için kaç örnek önizleme kaydedilsin (0 = hiç)"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  yoklama:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install pymupdf pillow pdfplumber reportlab

      - name: Sentetik bültenle ayrıştırıcıyı test et (iki arka uç)
        run: python tests/test_bulten_yoklama.py

      - name: Önbellek anahtarı
        id: key
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: echo "k=bulten-$(printf '%s' "$PDF_URL" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Aynı bülten ikinci kez indirilmez; önbellekten gelir (17 dk yerine birkaç saniye).
      - name: Bülteni önbellekten al
        id: cache
        uses: actions/cache@v4
        with:
          path: bulten-onbellek/bulten.pdf
          key: ${{ steps.key.outputs.k }}

      - name: Bülteni indir
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          mkdir -p bulten-onbellek
          # Bağlantı 2 dakika boyunca 10 KB/sn altına düşerse kes ve yeniden dene.
          curl -fL --retry 3 --retry-delay 10 --retry-all-errors \
            --speed-limit 10000 --speed-time 120 --max-time 3600 \
            -A "turk-marka-mcp yoklama (+https://github.com/skraptt/turk-marka-mcp)" \
            -o bulten-onbellek/bulten.pdf "$PDF_URL"

      - name: Dosyayı kontrol et
        run: |
          ls -lh bulten-onbellek/bulten.pdf
          head -c 5 bulten-onbellek/bulten.pdf | grep -q '%PDF' || { echo "İndirilen dosya PDF değil"; exit 1; }

      - name: Ayrıştır ve raporla
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          python tools/bulten_yoklama.py bulten-onbellek/bulten.pdf \
            --out cikti --max-pages "$MAX_PAGES" --samples "$SAMPLES"
          cat cikti/rapor.md >> "$GITHUB_STEP_SUMMARY"

      - name: Raporu ve örnekleri yükle
        uses: actions/upload-artifact@v4
        with:
          name: bulten-yoklama
          path: cikti/
          retention-days: 3
